[versions]
agp = "8.13.0"
kotlin = "2.2.21"
jaudiotagger = "3.0.1"
androidxCore = "1.18.0"
fragment = "1.9.1"
navigation = "2.10.2"
coroutines = "1.9.0"
okhttp = "4.12.0"
quickjs = "3.2.3"
zxing = "3.5.4"
media3 = "1.10.1"
junit = "4.13.2"
testRunner = "1.5.2"
testJunit = "1.1.5"

[libraries]
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
quickjs = { module = "wang.harlon.quickjs:wrapper-android", version.ref = "quickjs" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
