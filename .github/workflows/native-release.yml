name: Native Android release

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native-vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      draft:
        description: Keep the completed release as a draft
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: native-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, runpy
          release = runpy.run_path('scripts/publish-release.py')
          release['version_from_tag'](os.environ['RELEASE_TAG'])
          PY
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify release scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare native signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.NATIVE_KEYSTORE_BASE64 }}
          NATIVE_KEYSTORE_PATH: ${{ runner.temp }}/native-release.jks
          NATIVE_STORE_PASSWORD: ${{ secrets.NATIVE_STORE_PASSWORD }}
          NATIVE_KEY_ALIAS: ${{ secrets.NATIVE_KEY_ALIAS }}
          NATIVE_KEY_PASSWORD: ${{ secrets.NATIVE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/native-release.jks"
          python3 - <<'PY'
          import os
          escapes = {'\\': '\\\\', '\n': '\\n', '\r': '\\r', '\t': '\\t', '\f': '\\f', ' ': '\\ '}
          keys = ('NATIVE_KEYSTORE_PATH', 'NATIVE_STORE_PASSWORD', 'NATIVE_KEY_ALIAS', 'NATIVE_KEY_PASSWORD')
          with open('local.properties', 'a', encoding='utf-8') as properties:
              properties.write('\n')
              for key in keys:
                  value = ''.join(escapes.get(char, char) for char in os.environ[key])
                  properties.write(f'{key}={value}\n')
          PY
      - name: Build and upload native release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          KEEP_DRAFT: ${{ inputs.draft || false }}
        run: |
          arguments=(--tag "$RELEASE_TAG")
          if [[ "$KEEP_DRAFT" == 'true' ]]; then arguments+=(--draft); fi
          python3 scripts/publish-release.py "${arguments[@]}"
      - name: Save release APKs, notes and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-release-artifacts
          path: |
            app/build/reports/
            build/releases/
      - name: Remove temporary signing configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/native-release.jks" local.properties
